<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Summit Support — Inquiry Triage</title>
<style>
  :root {
    --ink: #1a1d21;
    --ink-soft: #4a4f57;
    --ink-faint: #878d96;
    --line: #e4e6e9;
    --line-soft: #eef0f2;
    --paper: #ffffff;
    --canvas: #f6f7f8;
    --brand: #2b5f4a;
    --brand-soft: #e8f0ec;
    --brand-ink: #1c4030;

    --open: #b8621b;
    --open-bg: #fdf2e7;
    --progress: #2563a8;
    --progress-bg: #eaf1f9;
    --closed: #5a8a3c;
    --closed-bg: #eef5e6;

    --radius: 10px;
    --radius-sm: 7px;
    --shadow: 0 1px 2px rgba(26,29,33,0.04), 0 4px 12px rgba(26,29,33,0.03);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background: var(--canvas);
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- Top bar ---- */
  .topbar {
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    padding: 0 28px;
    height: 60px;
    display: flex;
    align-items: center;
    gap: 20px;
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .brandmark {
    display: flex;
    align-items: center;
    gap: 11px;
    font-weight: 600;
    font-size: 15.5px;
    letter-spacing: -0.01em;
  }
  .brandmark .dot {
    width: 26px; height: 26px;
    background: var(--brand);
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 13px; font-weight: 700;
  }
  .topbar .spacer { flex: 1; }
  .topbar .meta {
    font-size: 12.5px;
    color: var(--ink-faint);
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .topbar .refresh {
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink-soft);
    padding: 7px 13px;
    border-radius: var(--radius-sm);
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    font-family: var(--font);
    transition: all 0.12s;
    display: flex; align-items: center; gap: 6px;
  }
  .topbar .refresh:hover { border-color: #cfd2d6; background: var(--canvas); }

  /* ---- Setup panel ---- */
  .setup {
    max-width: 560px;
    margin: 80px auto;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 34px 36px;
    box-shadow: var(--shadow);
  }
  .setup h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 7px; }
  .setup p.sub { color: var(--ink-soft); font-size: 14px; margin-bottom: 26px; }
  .setup label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 7px; color: var(--ink); }
  .setup .field { margin-bottom: 18px; }
  .setup input {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-family: var(--font);
    color: var(--ink);
    transition: border-color 0.12s;
  }
  .setup input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .setup .hint { font-size: 12px; color: var(--ink-faint); margin-top: 6px; line-height: 1.5; }
  .setup button {
    width: 100%;
    background: var(--brand);
    color: #fff;
    border: none;
    padding: 12px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--font);
    margin-top: 6px;
    transition: background 0.12s;
  }
  .setup button:hover { background: #234c3c; }
  .setup .err {
    background: #fdeaea; color: #a32020; border: 1px solid #f5cccc;
    padding: 10px 13px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 18px;
  }

  /* ---- Layout ---- */
  .wrap { display: flex; min-height: calc(100vh - 60px); }
  .main { flex: 1; padding: 26px 28px 60px; max-width: 1100px; margin: 0 auto; width: 100%; min-width: 0; }

  /* ---- Sidebar ---- */
  .sidebar {
    width: 232px;
    flex-shrink: 0;
    background: var(--paper);
    border-right: 1px solid var(--line);
    padding: 24px 18px;
    position: sticky;
    top: 60px;
    height: calc(100vh - 60px);
    overflow-y: auto;
  }
  .side-sec { margin-bottom: 22px; }
  .side-label {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.04em; color: var(--ink-faint); margin-bottom: 9px;
  }
  .side-btns { display: flex; flex-wrap: wrap; gap: 6px; }
  .side-btn {
    border: 1px solid var(--line); background: var(--paper); color: var(--ink-soft);
    padding: 6px 12px; border-radius: 7px; font-size: 12.5px; font-weight: 500;
    cursor: pointer; font-family: var(--font); transition: all 0.12s;
  }
  .side-btn:hover { border-color: #cfd2d6; }
  .side-btn.on { background: var(--brand); color: #fff; border-color: var(--brand); }
  .side-select {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: 7px; font-size: 13px; font-family: var(--font);
    color: var(--ink); background: var(--paper); cursor: pointer;
  }
  .side-select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .bubbles { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .bubble {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--brand-soft); color: var(--brand-ink);
    font-size: 12px; font-weight: 500; padding: 4px 6px 4px 10px;
    border-radius: 13px; line-height: 1.3;
  }
  .bubble-x {
    display: flex; align-items: center; justify-content: center;
    border: none; background: rgba(28,64,48,0.12); color: var(--brand-ink);
    width: 16px; height: 16px; border-radius: 50%; cursor: pointer; padding: 0;
    transition: background 0.12s;
  }
  .bubble-x:hover { background: rgba(28,64,48,0.28); }
  .clear-filters {
    width: 100%; border: none; background: none; color: var(--brand);
    font-size: 12.5px; font-weight: 600; cursor: pointer; font-family: var(--font);
    padding: 8px; border-radius: 7px; margin-top: 4px;
  }
  .clear-filters:hover { background: var(--brand-soft); }

  /* ---- View toggle ---- */
  .view-toggle { display: flex; gap: 2px; background: var(--canvas); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
  .vt {
    border: none; background: none; color: var(--ink-soft); padding: 6px 14px;
    border-radius: 6px; font-size: 12.5px; font-weight: 500; cursor: pointer; font-family: var(--font);
    transition: all 0.12s;
  }
  .vt.active { background: var(--paper); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.06); font-weight: 600; }

  /* ---- Flat chronological list ---- */
  .flat-list {
    border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--paper);
  }
  .r-cat {
    font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 5px;
  }

  /* ---- Stat strip ---- */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 13px;
    margin-bottom: 26px;
  }
  .stat {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
  }
  .stat .label { font-size: 12px; color: var(--ink-faint); font-weight: 500; margin-bottom: 6px; letter-spacing: 0.01em; }
  .stat .num { font-size: 27px; font-weight: 650; letter-spacing: -0.02em; }
  .stat.accent-open .num { color: var(--open); }
  .stat.accent-progress .num { color: var(--progress); }
  .stat.accent-closed .num { color: var(--closed); }

  /* ---- Toolbar ---- */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }
  .search {
    flex: 1;
    position: relative;
  }
  .search input {
    width: 100%;
    padding: 9px 13px 9px 34px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    font-size: 13.5px;
    font-family: var(--font);
    background: var(--paper);
  }
  .search input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--ink-faint); }
  .filter-chips { display: flex; gap: 7px; }
  .chip {
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink-soft);
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    font-family: var(--font);
    transition: all 0.12s;
    white-space: nowrap;
  }
  .chip:hover { border-color: #cfd2d6; }
  .chip.active { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* ---- Category group ---- */
  .group { margin-bottom: 15px; }
  .group-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 16px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    cursor: pointer;
    user-select: none;
    transition: border-color 0.12s;
  }
  .group.open .group-head { border-radius: var(--radius) var(--radius) 0 0; border-bottom-color: var(--line-soft); }
  .group-head:hover { border-color: #d6d9dc; }
  .group-head .caret {
    color: var(--ink-faint);
    transition: transform 0.15s;
    display: flex;
  }
  .group.open .group-head .caret { transform: rotate(90deg); }
  .group-head .cat-dot {
    width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0;
  }
  .group-head .cat-name { font-weight: 600; font-size: 14.5px; letter-spacing: -0.01em; }
  .group-head .cat-count {
    color: var(--ink-faint);
    font-size: 12.5px;
    font-weight: 500;
    background: var(--canvas);
    padding: 2px 9px;
    border-radius: 11px;
  }
  .group-head .cat-spacer { flex: 1; }
  .group-head .mini-open {
    font-size: 12px; color: var(--open); font-weight: 600;
  }

  .group-body {
    display: none;
    border: 1px solid var(--line);
    border-top: none;
    border-radius: 0 0 var(--radius) var(--radius);
    overflow: hidden;
  }
  .group.open .group-body { display: block; }

  /* ---- Inquiry row ---- */
  .row {
    background: var(--paper);
    border-bottom: 1px solid var(--line-soft);
  }
  .row:last-child { border-bottom: none; }

  /* Slim clickable header — always visible */
  .row-header {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 11px 16px;
    cursor: pointer;
    transition: background 0.1s;
  }
  .row-header:hover { background: #fafbfb; }
  .row.expanded .row-header { background: #f7f9f8; border-bottom: 1px solid var(--line-soft); }

  .row-header .status-pill {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 12px;
    cursor: pointer;
    border: 1px solid transparent;
    font-family: var(--font);
    min-width: 68px;
    text-align: center;
    transition: all 0.12s;
  }
  .status-pill.Open { background: var(--open-bg); color: var(--open); }
  .status-pill.Progress { background: var(--progress-bg); color: var(--progress); }
  .status-pill.Closed { background: var(--closed-bg); color: var(--closed); }
  .status-pill:hover { filter: brightness(0.96); }

  .rh-name { font-weight: 600; font-size: 13.5px; color: var(--ink); flex-shrink: 0; }
  .rh-pill {
    font-family: var(--font); border: 1px solid transparent; cursor: pointer;
    transition: all 0.12s; flex-shrink: 0;
  }
  .rh-pill:hover { filter: brightness(0.95); }
  .rh-cat { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 5px; }
  .rh-nature { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 5px; }
  .rh-sub {
    font-size: 11.5px; color: var(--brand-ink); background: var(--brand-soft);
    padding: 2px 8px; border-radius: 5px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px;
  }
  .rh-spacer { flex: 1; min-width: 8px; }
  .strada-pill {
    font-size: 10.5px; font-weight: 700; padding: 3px 10px; border-radius: 11px;
    flex-shrink: 0; letter-spacing: 0.02em; cursor: pointer; border: 1px solid transparent;
    font-family: var(--font); transition: all 0.12s; white-space: nowrap;
  }
  .strada-pill:hover { filter: brightness(0.96); }
  .strada-pill.s-new       { background: #eef1f4; color: #4a5568; }
  .strada-pill.s-responded { background: #eaf1f9; color: #2563a8; }
  .strada-pill.s-escalated { background: #fdf2e7; color: #b8621b; }
  .strada-pill.s-needs     { background: #fdecea; color: #c0392b; }
  .strada-pill.s-closed    { background: #eef5e6; color: #5a8a3c; }
  .strada-pill.s-unset     { background: var(--canvas); color: var(--ink-faint); border-color: var(--line); font-weight: 600; }
  .rh-loc { font-size: 12px; color: var(--ink-faint); flex-shrink: 0; white-space: nowrap; }
  .rh-caret { color: var(--ink-faint); display: flex; transition: transform 0.18s; flex-shrink: 0; }
  .row.expanded .rh-caret { transform: rotate(180deg); }

  /* Strada-status left accent on the whole row (matches pill colors) */
  .row.strada-accent-s-new       { box-shadow: inset 3px 0 0 #94a0ad; }
  .row.strada-accent-s-responded { box-shadow: inset 3px 0 0 #2563a8; }
  .row.strada-accent-s-escalated { box-shadow: inset 3px 0 0 #d98a3a; }
  .row.strada-accent-s-needs     { box-shadow: inset 3px 0 0 #d9534f; }
  .row.strada-accent-s-closed    { box-shadow: inset 3px 0 0 #5a8a3c; }
  .row.strada-accent-s-needs .row-header { background: #fef9f8; }
  .row.strada-accent-s-needs .row-header:hover { background: #fdf4f3; }

  /* Expanded detail area */
  .row-detail { display: none; padding: 16px 16px 15px; }
  .row.expanded .row-detail { display: block; }

  /* Two-column: fields on the left, action buttons on the right */
  .detail-grid { display: flex; gap: 20px; align-items: flex-start; }
  .detail-fields { flex: 1; min-width: 0; max-width: 640px; }
  .detail-actions {
    display: flex; flex-direction: column; gap: 7px; flex-shrink: 0; width: 168px;
    margin-left: auto;
  }

  .detail-meta {
    display: flex; align-items: center; flex-wrap: wrap; gap: 7px 16px;
    margin-bottom: 15px;
  }
  .detail-meta .dm { font-size: 12px; color: var(--ink-soft); }
  .detail-meta .dm-label { color: var(--ink-faint); font-weight: 500; }
  .reply-pill {
    font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 12px;
    cursor: pointer; border: 1px solid transparent; font-family: var(--font);
    min-width: 74px; text-align: center; transition: all 0.12s;
  }
  .reply-pill.Needs { background: #fbe9e7; color: #c0392b; border-color: #f3cfc9; }
  .reply-pill.Replied { background: var(--closed-bg); color: var(--closed); }
  .reply-pill:hover { filter: brightness(0.96); }

  /* Editable fields */
  .editable { margin-bottom: 12px; }
  .edit-label {
    display: block; font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.03em; color: var(--ink-faint); margin-bottom: 4px;
  }
  .edit-value {
    display: block; font-size: 13.5px; color: var(--ink-soft); line-height: 1.5;
    padding: 7px 10px; border-radius: 7px; border: 1px solid transparent;
    cursor: text; white-space: pre-wrap; transition: all 0.12s; min-height: 34px;
  }
  /* Blank fields sit at half height until filled */
  .edit-value.empty { color: var(--ink-faint); font-style: italic; min-height: 17px; padding: 4px 10px; }
  .edit-value:hover { background: #f7f8f9; border-color: var(--line); }
  .edit-input {
    width: 100%; font-size: 13.5px; font-family: var(--font); color: var(--ink);
    line-height: 1.5; padding: 7px 10px; border: 1px solid var(--brand);
    border-radius: 7px; box-shadow: 0 0 0 3px var(--brand-soft);
    resize: vertical; min-height: 54px; outline: none;
  }
  .readonly-field { margin-bottom: 12px; }
  .ro-value { display: block; font-size: 13px; color: var(--ink-soft); padding: 2px 10px; }

  /* Binary Complete/Needed dropdown — blank/white when unset */
  .binary-field { margin-bottom: 12px; }
  .binary-select {
    display: block; min-width: 130px; max-width: 100%; width: auto;
    font-size: 13px; font-family: var(--font); color: var(--ink);
    padding: 6px 10px; border: 1px solid var(--line); border-radius: 7px;
    background: var(--paper); cursor: pointer; transition: all 0.12s;
  }
  .binary-select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .binary-select.unset { color: var(--ink-faint); background: #fff; }

  /* Row holding Last Updated + the two follow-up dropdowns */
  .followup-row { display: flex; gap: 22px; align-items: flex-start; flex-wrap: wrap; }
  .followup-row .fu-updated { margin-bottom: 12px; }

  /* Tenant Info click-popover */
  .rh-name { cursor: pointer; }
  .rh-name:hover { color: var(--brand); text-decoration: underline; text-underline-offset: 2px; }
  .tenant-info {
    position: absolute; z-index: 300; width: 360px;
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: 0 8px 30px rgba(26,29,33,0.16);
    padding: 15px 16px 16px;
  }
  .ti-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .ti-title { font-size: 13px; font-weight: 700; color: var(--ink); letter-spacing: -0.01em; }
  .ti-reporter {
    font-size: 11.5px; font-family: var(--font); color: var(--ink); cursor: pointer;
    padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper);
    max-width: 175px;
  }
  .ti-reporter:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .ti-field { margin-bottom: 10px; }
  .ti-row2 { display: flex; gap: 10px; }
  .ti-row2 .ti-field { flex: 1; margin-bottom: 10px; }
  .ti-ro { display: block; font-size: 13px; color: var(--ink-soft); padding: 6px 0; }
  .ti-label {
    display: block; font-size: 10.5px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.03em; color: var(--ink-faint); margin-bottom: 4px;
  }
  .ti-input, .ti-select {
    width: 100%; font-size: 13px; font-family: var(--font); color: var(--ink);
    padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--paper); transition: all 0.12s;
  }
  .ti-input:focus, .ti-select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .ti-textarea {
    width: 100%; font-size: 13px; font-family: var(--font); color: var(--ink);
    line-height: 1.5; padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--paper); resize: vertical; min-height: 48px;
  }
  .ti-textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .ti-select { cursor: pointer; }
  .ti-addr { margin-bottom: 10px; }
  .ti-addr-row { display: flex; gap: 7px; }
  .ti-addr-row .ti-select:first-child { flex: 2; min-width: 0; }
  .ti-addr-row .ti-unit { flex: 1; min-width: 0; }
  .ti-addr-row .ti-select:last-child { flex: 1.3; min-width: 0; }
  .ti-mgmt-row { display: flex; gap: 8px; margin-top: 8px; }
  .ti-mgmt-field { flex: 1; min-width: 0; }
  .ti-mini-label { display: block; font-size: 9.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; color: var(--ink-faint); margin-bottom: 3px; }
  .ti-mini-select {
    width: 100%; font-size: 11.5px; font-family: var(--font); color: var(--ink-soft);
    padding: 4px 7px; border: 1px solid var(--line); border-radius: 5px; background: var(--paper); cursor: pointer;
  }
  .ti-mini-select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }

  .act {
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink-soft);
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    font-family: var(--font);
    white-space: nowrap;
    transition: all 0.12s;
    display: flex; align-items: center; gap: 6px; justify-content: flex-start;
    text-decoration: none;
  }
  .act:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }
  .act.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
  .act.primary:hover { background: #234c3c; color: #fff; }
  .act.collapse-btn { color: var(--ink-faint); margin-top: 4px; }

  /* ---- Status dropdown ---- */
  .status-menu {
    position: absolute;

function connect() {

  STATE.backendUrl = u; STATE.secret = s;

async function loadSheet() {
  document.getElementById("app").innerHTML = `
    <div class="topbar">
      <div class="brandmark"><span class="dot">S</span> Summit Support</div>
    </div>
    <div class="loading"><div class="spinner"></div>Loading inquiries…</div>`;

  try {
    const url = STATE.backendUrl + "?action=rows&secret=" + encodeURIComponent(STATE.secret);
    const res = await fetch(url);
    if (!res.ok) throw new Error("Backend returned " + res.status + ". Check the URL.");
    const json = await res.json();
    if (!json.ok) throw new Error(json.error === "Unauthorized" ? "Access key rejected." : json.error);

    STATE.columns = json.data.columns;
    STATE.rows = json.data.rows;
    STATE.permalink = json.data.permalink || "";
    renderDashboard();
  } catch (e) {
    renderSetup(e.message + " — check the backend URL and access key.");
  }
}

  s = (s || "").toLowerCase();
  if (s.includes("progress")) return "Progress";
  if (s.includes("close")) return "Closed";
  return "Open";
}
function statusLabel(cls){ return cls === "Progress" ? "In Progress" : cls; }
function normReply(s) {
  // Anything that isn't explicitly "Replied" is treated as needing a reply
  return (s || "").toLowerCase().includes("repl") && !(s || "").toLowerCase().includes("need")
    ? "Replied" : "Needs";
}

// Robustly parse Smartsheet dates (handles M/D/YY, MM/DD/YYYY, ISO)
function parseDate(v) {
  if (!v) return 0;
  const d = new Date(v);
  if (!isNaN(d)) return d.getTime();
  const m = String(v).match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if (m) {
    let yr = parseInt(m[3], 10);
    if (yr < 100) yr += 2000;
    return new Date(yr, parseInt(m[1],10)-1, parseInt(m[2],10)).getTime();
  }
  return 0;
}

// Distinct non-empty values for a column, sorted
function distinctValues(colName) {
  const set = new Set();
  STATE.rows.forEach(r => { const v = r[colName]; if (v) set.add(v); });
  return Array.from(set).sort();
}

// Multi-select control: a dropdown of not-yet-selected options + removable bubbles
function renderMultiSelect(key, options) {
  const selected = STATE.filters[key];
  const available = options.filter(o => !selected.includes(o));
  const dropdown = `
    <select class="side-select" onchange="addMulti('${key}', this.value); this.value='';">
      <option value="">${selected.length ? "Add another…" : "All"}</option>
      ${available.map(v => `<option value="${escapeAttr(v)}">${escapeHtml(v)}</option>`).join("")}
    </select>`;
  const bubbles = selected.length ? `
    <div class="bubbles">
      ${selected.map(v => `
        <span class="bubble">${escapeHtml(v)}
          <button class="bubble-x" onclick="removeMulti('${key}', ${JSON.stringify(v).replace(/"/g,'&quot;')})" title="Remove">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </span>`).join("")}
    </div>` : "";
  return dropdown + bubbles;
}
function anyFilterActive() {
  const f = STATE.filters;
  return f.status.length || f.stradaStatus.length || f.correspondence.length || f.pmCompany.length || f.napmGroup.length ||
         f.inquiryNature.length || f.inquiryType.length || f.subCategory.length ||
         f.mgmtFollowUp.length || f.tenantFollowUp.length;
}

// Apply all active filters + search to the row set
function applyFilters(rows) {
  const f = STATE.filters;
  if (f.status.length) rows = rows.filter(r => f.status.includes(normStatus(r[COLS.status])));
  if (f.stradaStatus.length) rows = rows.filter(r => f.stradaStatus.includes(r[COLS.stradaStatus]||""));
  if (f.correspondence.length) {
    rows = rows.filter(r => {
      const c = (r[COLS.correspondence] || "").toLowerCase();
      return f.correspondence.some(sel =>
        sel === "Email" ? c.includes("email") : (c.includes("person") || c.includes("in-person") || c.includes("in person"))
      );
    });
  }
  if (f.pmCompany.length) rows = rows.filter(r => f.pmCompany.includes(r[COLS.pmCompany]||""));
  if (f.napmGroup.length) rows = rows.filter(r => f.napmGroup.includes(r[COLS.napmGroup]||""));
  if (f.inquiryNature.length) rows = rows.filter(r => f.inquiryNature.includes(r[COLS.inquiryNature]||""));
  if (f.inquiryType.length) rows = rows.filter(r => f.inquiryType.includes(r[COLS.inquiryType]||""));
  if (f.subCategory.length) rows = rows.filter(r => f.subCategory.includes(r[COLS.subCategory]||""));
  if (f.mgmtFollowUp.length) rows = rows.filter(r => f.mgmtFollowUp.includes(r[COLS.mgmtFollowUp]||""));
  if (f.tenantFollowUp.length) rows = rows.filter(r => f.tenantFollowUp.includes(r[COLS.tenantFollowUp]||""));

  const q = STATE.search.trim().toLowerCase();
  if (q) {
    rows = rows.filter(r =>
      (r[COLS.name]||"").toLowerCase().includes(q) ||
      (r[COLS.addressStr]||"").toLowerCase().includes(q) ||
      (r[COLS.address]||"").toLowerCase().includes(q) ||
      (r[COLS.description]||"").toLowerCase().includes(q)
    );
  }
  return rows;
}

function renderGroups() {
  let rows = applyFilters(STATE.rows.slice());
  const el = document.getElementById("groups");

  if (!rows.length) {
    el.innerHTML = `<div class="empty">No inquiries match your filters.</div>`;
    return;
  }

  if (STATE.viewMode === "chronological") {
    // Flat list, newest first
    rows.sort((a, b) => parseDate(b[COLS.dateReceived]) - parseDate(a[COLS.dateReceived]));
    el.innerHTML = `<div class="flat-list">${rows.map(r => renderRow(r, true)).join("")}</div>`;
    return;
  }

  // Category view — grouped, each group sorted newest first
  const groups = {};
  rows.forEach(r => {
    const cat = r[COLS.inquiryType] || "Uncategorized";
    (groups[cat] = groups[cat] || []).push(r);
  });
  Object.keys(groups).forEach(cat => {
    groups[cat].sort((a, b) => parseDate(b[COLS.dateReceived]) - parseDate(a[COLS.dateReceived]));
  });

  const catOrder = Object.keys(CATEGORY_COLORS).filter(c => groups[c]);
  Object.keys(groups).forEach(c => { if (!catOrder.includes(c)) catOrder.push(c); });

  el.innerHTML = catOrder.map(cat => {
    const items = groups[cat];
    const color = CATEGORY_COLORS[cat] || "#6b7280";
    const openCount = items.filter(r => normStatus(r[COLS.status]) === "Open").length;
    const isOpen = STATE.openGroups[cat] !== false;
    return `
      <div class="group ${isOpen?'open':''}" data-cat="${escapeAttr(cat)}">
        <div class="group-head" onclick="toggleGroup('${escapeAttr(cat)}')">
          <span class="caret"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></span>
          <span class="cat-dot" style="background:${color}"></span>

        <div class="group-body">

  }).join("");
}

// ---- Inline text editing ----
let activeEdit = null; // { rowId, field }

function startEdit(rowId, field, ev) {
  if (ev) ev.stopPropagation();
  const wrap = document.querySelector(`.editable[data-field="${field}"][data-rowid="${rowId}"]`);
  if (!wrap) return;
  const valSpan = wrap.querySelector(".edit-value");
  const row = STATE.rows.find(r => r._id === rowId);
  const current = row ? (row[COLS[field]] || "") : "";

  // Build a textarea in place
  const ta = document.createElement("textarea");
  ta.className = "edit-input";
  ta.value = current;
  valSpan.replaceWith(ta);
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);
  activeEdit = { rowId, field };

  // Save on blur, or on Enter (without Shift). Escape cancels.
  ta.addEventListener("blur", () => saveEdit(rowId, field, ta.value));
  ta.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ta.blur(); }
    else if (e.key === "Escape") { activeEdit = null; renderGroups(); }
  });
}

async function saveEdit(rowId, field, newValue) {
  if (!activeEdit) return; // already handled (e.g. Escape)
  activeEdit = null;
  const row = STATE.rows.find(r => r._id === rowId);
  if (!row) return;
  const colName = COLS[field];
  const prev = row[colName] || "";
  if (newValue === prev) { renderGroups(); return; } // no change

  row[colName] = newValue; // optimistic
  renderGroups();

  try {
    const res = await fetch(STATE.backendUrl, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        secret: STATE.secret,
        action: "updateCell",
        rowId: rowId,
        columnName: colName,
        value: newValue
      })
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || "update failed");
    toast("Saved");
  } catch (e) {
    row[colName] = prev; // revert
    renderGroups();
    toast("Couldn't save — try again");
  }
}

// Generic save of any column value for a row (used by the Tenant Info box)
async function saveField(rowId, colName, newValue) {
  const row = STATE.rows.find(r => r._id === rowId);
  if (!row) return;
  const prev = row[colName] || "";
  if (newValue === prev) return;
  row[colName] = newValue; // optimistic
  try {
    const res = await fetch(STATE.backendUrl, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        secret: STATE.secret, action: "updateCell",
        rowId: rowId, columnName: colName, value: newValue
      })
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || "update failed");
    toast("Saved");
  } catch (e) {
    row[colName] = prev; // revert
    toast("Couldn't save — try again");
    // Re-render the box to show reverted value
    const existing = document.getElementById("tenantInfoBox");
    if (existing) renderTenantInfoInto(existing, rowId);
  }
}

  const visible = applyFilters(STATE.rows.slice());
  const nums = document.querySelectorAll(".stat .num");
  if (nums.length === 4) {
    nums[0].textContent = visible.length;
    nums[1].textContent = visible.filter(r => normStatus(r[COLS.status]) === "Open").length;

    nums[3].textContent = visible.filter(r => normStatus(r[COLS.status]) === "Closed").length;

  if (meta) meta.textContent = (visible.length === STATE.rows.length) ? `${visible.length} total` : `${visible.length} of ${STATE.rows.length}`;

async function changeStatus(rowId, newStatus) {
  closeStatusMenu();
  const row = STATE.rows.find(r => r._id === rowId);
  if (!row) return;
  const prev = row[COLS.status];
  row[COLS.status] = newStatus;  // optimistic
  renderGroups();
  updateStatCounts();

  try {
    const res = await fetch(STATE.backendUrl, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        secret: STATE.secret,
        action: "updateStatus",
        rowId: rowId,
        status: newStatus
      })
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || "update failed");
    toast(`Marked ${newStatus}`);
  } catch (e) {
    row[COLS.status] = prev; // revert
    renderGroups();
    updateStatCounts();
    toast("Couldn't update Smartsheet — try again");
  }
}

// ---- Strada Status change ----
function stradaClass(v) {
  const s = (v || "").toLowerCase();
  if (s.includes("escalat")) return "s-escalated";
  if (s.includes("needs")) return "s-needs";
  if (s.includes("respond")) return "s-responded";
  if (s.includes("clos")) return "s-closed";
  if (s.includes("new")) return "s-new";
  return "s-unset";
}

function openStradaMenu(ev, rowId) {
  ev.stopPropagation();
  closeStatusMenu();
  const menu = document.createElement("div");
  menu.className = "status-menu";
  menu.innerHTML = STRADA_STATUS_OPTIONS.map(s => `<button onclick="changeStrada(${rowId}, ${JSON.stringify(s).replace(/"/g,'&quot;')})">${s}</button>`).join("");
  document.body.appendChild(menu);
  const rect = ev.target.getBoundingClientRect();
  menu.style.top = (rect.bottom + window.scrollY + 4) + "px";
  let left = rect.left + window.scrollX;

  menu.style.left = left + "px";
  activeMenu = menu;
  setTimeout(() => document.addEventListener("click", closeStatusMenu, { once: true }), 0);
}

async function changeStrada(rowId, newStatus) {

// ---- Generic dropdown menu for header pills (Nature / Type / Sub-category) ----

function openNatureMenu(ev, rowId) { openOptionsMenu(ev, rowId, COLS.inquiryNature, INQUIRY_NATURE_OPTIONS); }
function openTypeMenu(ev, rowId) { openOptionsMenu(ev, rowId, COLS.inquiryType, INQUIRY_TYPE_OPTIONS); }
function openSubMenu(ev, rowId) {
  const row = STATE.rows.find(r => r._id === rowId);
  const type = row ? (row[COLS.inquiryType] || "") : "";
  const opts = SUBCATEGORY_BY_TYPE[type] || [];

// Generic field change with optimistic update + revert
async function changeField(rowId, colName, newValue) {
  closeStatusMenu();
  const row = STATE.rows.find(r => r._id === rowId);
  if (!row) return;
  const prev = row[colName];
  row[colName] = newValue;  // optimistic
  // If inquiry type changed, clear a now-invalid sub-category
  if (colName === COLS.inquiryType) {
    const validSubs = SUBCATEGORY_BY_TYPE[newValue] || [];
    if (row[COLS.subCategory] && !validSubs.includes(row[COLS.subCategory])) {
      row[COLS.subCategory] = "";
    }
  }
  renderGroups();

  try {
    const res = await fetch(STATE.backendUrl, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        secret: STATE.secret, action: "updateCell",
        rowId: rowId, columnName: colName, value: newValue
      })
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || "update failed");
    toast("Saved");
  } catch (e) {
    row[colName] = prev; // revert
    renderGroups();
    toast("Couldn't update Smartsheet — try again");
  }
}

// ---- Toggle reply status (Needs Reply <-> Replied) ----
async function toggleReply(ev, rowId) {
  ev.stopPropagation();
  const row = STATE.rows.find(r => r._id === rowId);
  if (!row) return;
  const cur = normReply(row[COLS.replyStatus]);
  const next = cur === "Replied" ? "Needs Reply" : "Replied";
  const prev = row[COLS.replyStatus];

  try {
    const res = await fetch(STATE.backendUrl, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        secret: STATE.secret,
        action: "updateCell",
        rowId: rowId,
        columnName: COLS.replyStatus,
        value: next
      })
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || "update failed");
    toast(`Marked ${next}`);
  } catch (e) {
    row[COLS.replyStatus] = prev; // revert
    renderGroups();
    toast("Couldn't update Smartsheet — try again");
  }
}

// ---- Draft reply / forward ----
let modalUrl = "";
async function draftReply(rowId) {
  const r = STATE.rows.find(x => x._id === rowId);
  if (!r) return;
  const name = r[COLS.name] || "there";
  const firstName = name.split(" ")[0];
  const email = r[COLS.email] || "";
  const issue = r[COLS.inquiryType] || "your inquiry";
  const subject = "Re: " + (r[COLS.subCategory] || issue);

  // Show a template immediately, then let AI refine it
  const template =
`Hi ${firstName},

Thank you for reaching out to the Summit support team. We've received your message regarding ${issue.toLowerCase()} and wanted to confirm it's been logged.

We're looking into this and will follow up with an update as soon as possible. If you have any additional details to share in the meantime, just reply to this email.

Best regards,
Summit Support Team`;

  showModal("Draft reply", email, subject, template, email);

  // Ask backend for an AI-generated version
  const ta = document.getElementById("modalText");
  const orig = ta.value;
  ta.value = "Generating draft…";
  ta.disabled = true;
  try {
    const res = await fetch(STATE.backendUrl, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        secret: STATE.secret,
        action: "draftReply",
        inquiry: {
          name: name,
          inquiryType: r[COLS.inquiryType] || "",
          subCategory: r[COLS.subCategory] || "",
          description: r[COLS.description] || ""
        }
      })
    });
    const json = await res.json();
    ta.value = (json.ok && json.draft) ? json.draft : orig;
  } catch (e) {
    ta.value = orig; // fall back to template
  }
  ta.disabled = false;
}

function draftForward(rowId) {
  const r = STATE.rows.find(x => x._id === rowId);
  if (!r) return;
  const name = r[COLS.name] || "Unknown";
  const addr = r[COLS.addressStr] || r[COLS.address] || "";
  const apt = r[COLS.apt] || "";
  const phone = r[COLS.phone] || "";
  const email = r[COLS.email] || "";
  const issue = r[COLS.inquiryType] || "";
  const sub = r[COLS.subCategory] || "";
  const desc = r[COLS.description] || "";
  const subject = `Tenant issue — ${addr}${apt ? " #"+apt : ""} — ${issue}`;

  const body =
`Please see the below tenant issue for your review and handling:

Tenant: ${name}
Address: ${addr}${apt ? " #"+apt : ""}
Phone: ${phone || "N/A"}
Email: ${email || "N/A"}
Category: ${issue}${sub ? " — " + sub : ""}

Description:
${desc}

Please advise on next steps or confirm once addressed. Thank you.

Summit Support Team`;

  showModal("Draft forward", "", subject, body);
}

function showModal(title, to, subject, body, threadEmail) {
  document.getElementById("modalTitle").textContent = title;
  document.getElementById("modalTo").textContent = to || "(enter recipient in Gmail)";
  document.getElementById("modalSubj").textContent = subject;
  document.getElementById("modalText").value = body;
  document.getElementById("overlay").classList.add("show");

  document.getElementById("modalOpenBtn").onclick = function() {
    const finalBody = document.getElementById("modalText").value;
    // Open the compose draft FIRST — it's the primary action and least likely to
    // be popup-blocked. Then open the thread a moment later. Subject starts with
    // "Re:" so Gmail groups the sent reply into the same conversation.
    const url = "https://mail.google.com/mail/?view=cm&fs=1"
      + (to ? "&to=" + encodeURIComponent(to) : "")
      + "&su=" + encodeURIComponent(subject)
      + "&body=" + encodeURIComponent(finalBody);
    window.open(url, "_blank");
    if (threadEmail) {
      setTimeout(function() { openGmailThread(threadEmail); }, 400);
    }
    closeModal();
    toast(threadEmail ? "Opened draft and thread in Gmail" : "Opened draft in Gmail");
  };
}
function closeModal() { document.getElementById("overlay").classList.remove("show"); }

// ---- Shared helper: open a tenant's Gmail thread in a side window ----
function openGmailThread(email) {
  const q = `from:(${email}) OR to:(${email})`;
  const url = "https://mail.google.com/mail/u/0/#search/" + encodeURIComponent(q);
  const w = Math.min(760, Math.floor(screen.width * 0.55));
  const feats = `width=${w},height=${Math.floor(screen.height*0.9)},left=${screen.width-w-20},top=40`;
  window.open(url, "gmailThread", feats);
}

// ---- Open Gmail thread for this tenant (Thread button) ----
function openThread(rowId) {
  const r = STATE.rows.find(x => x._id === rowId);
  if (!r) return;
  const email = r[COLS.email] || "";
  if (!email) { toast("No email address on this inquiry"); return; }
  openGmailThread(email);
}

// ---- Open this row in Smartsheet ----
function openInSmartsheet(rowId) {
  const r = STATE.rows.find(x => x._id === rowId);
  if (!STATE.permalink) { toast("Smartsheet link unavailable"); return; }
  // Permalink opens the sheet; append the row anchor so it scrolls to it
  const url = STATE.permalink + (r && r._rowNumber ? "?rowId=" + r._id : "");
  window.open(url, "_blank");
}

// ============================================================
//  UTILITIES
// ============================================================
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }
function fmtDate(d){
  // Smartsheet may return ISO or serial-ish; try to make it readable
  const dt = new Date(d);
  if (!isNaN(dt) && String(d).includes("-")) {
    return dt.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  }
  return d;
}
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2400);
}

// ============================================================
//  BOOT
// ============================================================
if (STATE.backendUrl && STATE.secret) { loadSheet(); }
else { renderSetup(); }
