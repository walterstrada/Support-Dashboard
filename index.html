<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Summit Support — Inquiry Triage</title>
<style>
  :root {
    --ink: #1a1d21;
    --ink-soft: #4a4f57;
    --ink-faint: #878d96;
    --line: #e4e6e9;
    --line-soft: #eef0f2;
    --paper: #ffffff;
    --canvas: #f6f7f8;
    --brand: #2b5f4a;
    --brand-soft: #e8f0ec;
    --brand-ink: #1c4030;

    --open: #b8621b;
    --open-bg: #fdf2e7;
    --progress: #2563a8;
    --progress-bg: #eaf1f9;
    --closed: #5a8a3c;
    --closed-bg: #eef5e6;

    --radius: 10px;
    --radius-sm: 7px;
    --shadow: 0 1px 2px rgba(26,29,33,0.04), 0 4px 12px rgba(26,29,33,0.03);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background: var(--canvas);
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- Top bar ---- */
  .topbar {
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    padding: 0 28px;
    height: 60px;
    display: flex;
    align-items: center;
    gap: 20px;
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .brandmark {
    display: flex;
    align-items: center;
    gap: 11px;
    font-weight: 600;
    font-size: 15.5px;
    letter-spacing: -0.01em;
  }
  .brandmark .dot {
    width: 26px; height: 26px;
    background: var(--brand);
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 13px; font-weight: 700;
  }
  .topbar .spacer { flex: 1; }
  .topbar .meta {
    font-size: 12.5px;
    color: var(--ink-faint);
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .topbar .refresh {
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink-soft);
    padding: 7px 13px;
    border-radius: var(--radius-sm);
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    font-family: var(--font);
    transition: all 0.12s;
    display: flex; align-items: center; gap: 6px;
  }
  .topbar .refresh:hover { border-color: #cfd2d6; background: var(--canvas); }

  /* ---- Setup panel ---- */
  .setup {
    max-width: 560px;
    margin: 80px auto;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 34px 36px;
    box-shadow: var(--shadow);
  }
  .setup h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 7px; }
  .setup p.sub { color: var(--ink-soft); font-size: 14px; margin-bottom: 26px; }
  .setup label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 7px; color: var(--ink); }
  .setup .field { margin-bottom: 18px; }
  .setup input {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-family: var(--font);
    color: var(--ink);
    transition: border-color 0.12s;
  }
  .setup input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .setup .hint { font-size: 12px; color: var(--ink-faint); margin-top: 6px; line-height: 1.5; }
  .setup button {
    width: 100%;
    background: var(--brand);
    color: #fff;
    border: none;
    padding: 12px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--font);
    margin-top: 6px;
    transition: background 0.12s;
  }
  .setup button:hover { background: #234c3c; }
  .setup .err {
    background: #fdeaea; color: #a32020; border: 1px solid #f5cccc;
    padding: 10px 13px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 18px;
  }

  /* ---- Layout ---- */
  .wrap { display: flex; min-height: calc(100vh - 60px); }
  .main { flex: 1; padding: 26px 28px 60px; max-width: 1100px; margin: 0 auto; width: 100%; min-width: 0; }

  /* ---- Sidebar ---- */
  .sidebar {
    width: 232px;
    flex-shrink: 0;
    background: var(--paper);
    border-right: 1px solid var(--line);
    padding: 24px 18px;
    position: sticky;
    top: 60px;
    height: calc(100vh - 60px);
    overflow-y: auto;
  }
  .side-sec { margin-bottom: 22px; }
  .side-label {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.04em; color: var(--ink-faint); margin-bottom: 9px;
  }
  .side-btns { display: flex; flex-wrap: wrap; gap: 6px; }
  .side-btn {
    border: 1px solid var(--line); background: var(--paper); color: var(--ink-soft);
    padding: 6px 12px; border-radius: 7px; font-size: 12.5px; font-weight: 500;
    cursor: pointer; font-family: var(--font); transition: all 0.12s;
  }
  .side-btn:hover { border-color: #cfd2d6; }
  .side-btn.on { background: var(--brand); color: #fff; border-color: var(--brand); }
  .side-select {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: 7px; font-size: 13px; font-family: var(--font);
    color: var(--ink); background: var(--paper); cursor: pointer;
  }
  .side-select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .clear-filters {
    width: 100%; border: none; background: none; color: var(--brand);
    font-size: 12.5px; font-weight: 600; cursor: pointer; font-family: var(--font);
    padding: 8px; border-radius: 7px; margin-top: 4px;
  }
  .clear-filters:hover { background: var(--brand-soft); }

  /* ---- View toggle ---- */
  .view-toggle { display: flex; gap: 2px; background: var(--canvas); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
  .vt {
    border: none; background: none; color: var(--ink-soft); padding: 6px 14px;
    border-radius: 6px; font-size: 12.5px; font-weight: 500; cursor: pointer; font-family: var(--font);
    transition: all 0.12s;
  }
  .vt.active { background: var(--paper); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.06); font-weight: 600; }

  /* ---- Flat chronological list ---- */
  .flat-list {
    border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--paper);
  }
  .r-cat {
    font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 5px;
  }

  /* ---- Stat strip ---- */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 13px;
    margin-bottom: 26px;
  }
  .stat {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
  }
  .stat .label { font-size: 12px; color: var(--ink-faint); font-weight: 500; margin-bottom: 6px; letter-spacing: 0.01em; }
  .stat .num { font-size: 27px; font-weight: 650; letter-spacing: -0.02em; }
  .stat.accent-open .num { color: var(--open); }
  .stat.accent-progress .num { color: var(--progress); }
  .stat.accent-closed .num { color: var(--closed); }

  /* ---- Toolbar ---- */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }
  .search {
    flex: 1;
    position: relative;
  }
  .search input {
    width: 100%;
    padding: 9px 13px 9px 34px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    font-size: 13.5px;
    font-family: var(--font);
    background: var(--paper);
  }
  .search input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--ink-faint); }
  .filter-chips { display: flex; gap: 7px; }
  .chip {
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink-soft);
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    font-family: var(--font);
    transition: all 0.12s;
    white-space: nowrap;
  }
  .chip:hover { border-color: #cfd2d6; }
  .chip.active { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* ---- Category group ---- */
  .group { margin-bottom: 15px; }
  .group-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 16px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    cursor: pointer;
    user-select: none;
    transition: border-color 0.12s;
  }
  .group.open .group-head { border-radius: var(--radius) var(--radius) 0 0; border-bottom-color: var(--line-soft); }
  .group-head:hover { border-color: #d6d9dc; }
  .group-head .caret {
    color: var(--ink-faint);
    transition: transform 0.15s;
    display: flex;
  }
  .group.open .group-head .caret { transform: rotate(90deg); }
  .group-head .cat-dot {
    width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0;
  }
  .group-head .cat-name { font-weight: 600; font-size: 14.5px; letter-spacing: -0.01em; }
  .group-head .cat-count {
    color: var(--ink-faint);
    font-size: 12.5px;
    font-weight: 500;
    background: var(--canvas);
    padding: 2px 9px;
    border-radius: 11px;
  }
  .group-head .cat-spacer { flex: 1; }
  .group-head .mini-open {
    font-size: 12px; color: var(--open); font-weight: 600;
  }

  .group-body {
    display: none;
    border: 1px solid var(--line);
    border-top: none;
    border-radius: 0 0 var(--radius) var(--radius);
    overflow: hidden;
  }
  .group.open .group-body { display: block; }

  /* ---- Inquiry row ---- */
  .row {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 14px 16px;
    background: var(--paper);
    border-bottom: 1px solid var(--line-soft);
    transition: background 0.1s;
  }
  .row:last-child { border-bottom: none; }
  .row:hover { background: #fafbfb; }

  .row .status-pill {
    flex-shrink: 0;
    font-size: 11.5px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 13px;
    cursor: pointer;
    border: 1px solid transparent;
    font-family: var(--font);
    letter-spacing: 0.01em;
    min-width: 74px;
    text-align: center;
    transition: all 0.12s;
  }
  .status-pill.Open { background: var(--open-bg); color: var(--open); }
  .status-pill.Progress { background: var(--progress-bg); color: var(--progress); }
  .status-pill.Closed { background: var(--closed-bg); color: var(--closed); }
  .status-pill:hover { filter: brightness(0.96); }

  .pill-stack { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
  .reply-pill {
    font-size: 11px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 13px;
    cursor: pointer;
    border: 1px solid transparent;
    font-family: var(--font);
    letter-spacing: 0.01em;
    min-width: 74px;
    text-align: center;
    transition: all 0.12s;
  }
  .reply-pill.Needs { background: #fbe9e7; color: #c0392b; border-color: #f3cfc9; }
  .reply-pill.Replied { background: var(--closed-bg); color: var(--closed); }
  .reply-pill:hover { filter: brightness(0.96); }

  /* A row that still needs a reply gets a subtle left accent + tint */
  .row.needs-reply {
    background: #fef9f8;
    box-shadow: inset 3px 0 0 #d9534f;
  }
  .row.needs-reply:hover { background: #fdf4f3; }

  .row .body { flex: 1; min-width: 0; }
  .row .r-top {
    display: flex; align-items: baseline; gap: 9px; margin-bottom: 3px;
  }
  .row .r-name { font-weight: 600; font-size: 13.5px; color: var(--ink); }
  .row .r-loc { font-size: 12.5px; color: var(--ink-faint); }
  .row .r-sub {
    font-size: 11.5px; color: var(--brand-ink); background: var(--brand-soft);
    padding: 1px 8px; border-radius: 5px; font-weight: 500;
  }
  .row .r-desc {
    font-size: 13px; color: var(--ink-soft); line-height: 1.55;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .row .r-meta {
    display: flex; gap: 14px; margin-top: 6px; font-size: 12px; color: var(--ink-faint);
  }
  .row .r-meta span { display: flex; align-items: center; gap: 5px; }

  .row .actions { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
  .act {
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink-soft);
    padding: 6px 11px;
    border-radius: var(--radius-sm);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    font-family: var(--font);
    white-space: nowrap;
    transition: all 0.12s;
    display: flex; align-items: center; gap: 6px;
    text-decoration: none;
  }
  .act:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }
  .act.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
  .act.primary:hover { background: #234c3c; color: #fff; }

  /* ---- Status dropdown ---- */
  .status-menu {
    position: absolute;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    box-shadow: 0 4px 16px rgba(26,29,33,0.12);
    padding: 5px;
    z-index: 100;
    min-width: 130px;
  }
  .status-menu button {
    display: block; width: 100%; text-align: left;
    border: none; background: none; padding: 8px 11px;
    font-size: 13px; cursor: pointer; border-radius: 5px;
    font-family: var(--font); color: var(--ink);
  }
  .status-menu button:hover { background: var(--canvas); }

  /* ---- Empty / loading ---- */
  .loading, .empty {
    text-align: center; padding: 70px 20px; color: var(--ink-faint);
  }
  .loading .spinner {
    width: 26px; height: 26px; border: 2.5px solid var(--line);
    border-top-color: var(--brand); border-radius: 50%;
    margin: 0 auto 16px; animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- Toast ---- */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--ink); color: #fff; padding: 11px 20px; border-radius: 9px;
    font-size: 13px; font-weight: 500; z-index: 200; opacity: 0;
    transition: all 0.25s; box-shadow: 0 6px 20px rgba(0,0,0,0.2);
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* ---- Modal for draft ---- */
  .overlay {
    position: fixed; inset: 0; background: rgba(26,29,33,0.4);
    display: none; align-items: center; justify-content: center; z-index: 150; padding: 20px;
  }
  .overlay.show { display: flex; }
  .modal {
    background: var(--paper); border-radius: 14px; max-width: 620px; width: 100%;
    max-height: 88vh; overflow: hidden; display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .modal-head {
    padding: 18px 22px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
  }
  .modal-head h3 { font-size: 15.5px; font-weight: 600; }
  .modal-head .x { cursor: pointer; color: var(--ink-faint); border: none; background: none; padding: 4px; display: flex; }
  .modal-body { padding: 20px 22px; overflow-y: auto; }
  .modal-body .to-line { font-size: 13px; color: var(--ink-soft); margin-bottom: 4px; }
  .modal-body .to-line b { color: var(--ink); font-weight: 600; }
  .modal-body textarea {
    width: 100%; min-height: 260px; border: 1px solid var(--line); border-radius: var(--radius-sm);
    padding: 13px; font-size: 13.5px; font-family: var(--font); line-height: 1.6; color: var(--ink);
    resize: vertical; margin-top: 14px;
  }
  .modal-body textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .modal-foot {
    padding: 15px 22px; border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: flex-end;
  }
  .modal-foot button {
    padding: 10px 18px; border-radius: var(--radius-sm); font-size: 13.5px; font-weight: 600;
    cursor: pointer; font-family: var(--font); border: 1px solid var(--line); background: var(--paper); color: var(--ink-soft);
  }
  .modal-foot button.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
  .modal-foot button.primary:hover { background: #234c3c; }
  .draft-note { font-size: 12px; color: var(--ink-faint); margin-top: 10px; display: flex; align-items: center; gap: 6px; }

  @media (max-width: 860px) {
    .wrap { flex-direction: column; }
    .sidebar {
      width: 100%; height: auto; position: static;
      border-right: none; border-bottom: 1px solid var(--line);
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px 20px;
    }
    .sidebar .clear-filters { grid-column: 1 / -1; }
  }
  @media (max-width: 720px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .row { flex-wrap: wrap; }
    .row .actions { flex-direction: row; width: 100%; margin-top: 8px; }
    .toolbar { flex-wrap: wrap; }
    .search { flex-basis: 100%; }
    .view-toggle .vt { padding: 6px 10px; }
  }
</style>
</head>
<body>

<div id="app"></div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">Draft response</h3>
      <button class="x" onclick="closeModal()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="to-line">To: <b id="modalTo"></b></div>
      <div class="to-line" id="modalSubjLine">Subject: <b id="modalSubj"></b></div>
      <textarea id="modalText"></textarea>
      <div class="draft-note">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        Review and edit before sending. Opens in Gmail — nothing sends automatically.
      </div>
    </div>
    <div class="modal-foot">
      <button onclick="closeModal()">Cancel</button>
      <button class="primary" id="modalOpenBtn">Open in Gmail</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
//  CONFIG — column name mapping (matches your Smartsheet)
// ============================================================
const COLS = {
  type: "Type",
  status: "Status",
  name: "Tenant Name",
  email: "Tenant Email",
  phone: "Tenant Phone",
  borough: "Borough",
  addressStr: "Address (String)",
  address: "Address",
  apt: "Apt #",
  correspondence: "Correspondence",
  inquiryNature: "Inquiry Nature",
  inquiryType: "Inquiry Type",
  subCategory: "Inquiry Subcategory",
  description: "Description of Issue",
  statusProgress: "Status Progress",
  replyStatus: "Reply Status",
  flaggedForReview: "Flagged for Review",
  reviewNotes: "Review Notes",
  dateReceived: "Date Inquiry Received",
  staff: "Staff Handling Inquiry"
};

const CATEGORY_COLORS = {
  "Rent Payment Issue": "#2563a8",
  "Billing Issue": "#7c5cbf",
  "Lease Issue": "#b8621b",
  "Arrears Assistance": "#c0392b",
  "Maintenance Issue": "#2b8a5f",
  "Relocation Question": "#0d8a94",
  "Property Management Issue": "#846b28",
  "Tenant Association - General": "#c2417a",
  "Other": "#6b7280",
  "Uncategorized": "#a0a4aa"
};

const STATUS_OPTIONS = ["Open", "In Progress", "Closed"];

let STATE = {
  backendUrl: localStorage_get("sd_url"),
  secret: localStorage_get("sd_secret"),
  permalink: "",
  columns: {},
  rows: [],
  search: "",
  statusFilter: "all",
  viewMode: "category",      // "category" or "chronological"
  filters: {
    status: [],              // multi-select: Open / Progress / Closed
    correspondence: [],      // multi-select: Email / In-Person
    inquiryNature: "",       // single dropdown
    inquiryType: "",         // single dropdown
    subCategory: ""          // single dropdown
  },
  openGroups: {}
};

// localStorage is blocked in some sandboxes — wrap safely
function localStorage_get(k){ try { return localStorage.getItem(k) || ""; } catch(e){ return ""; } }
function localStorage_set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }

// ============================================================
//  RENDER: setup screen
// ============================================================
function renderSetup(errMsg) {
  document.getElementById("app").innerHTML = `
    <div class="setup">
      <h1>Connect to Summit Support</h1>
      <p class="sub">Enter the backend URL and access key to load the inquiry tracker.</p>
      ${errMsg ? `<div class="err">${errMsg}</div>` : ""}
      <div class="field">
        <label>Backend URL</label>
        <input type="text" id="in_url" placeholder="https://script.google.com/macros/s/.../exec" value="${escapeAttr(STATE.backendUrl)}">
        <div class="hint">The web app /exec URL from your Apps Script deployment</div>
      </div>
      <div class="field">
        <label>Access key</label>
        <input type="password" id="in_secret" placeholder="Shared secret" value="${escapeAttr(STATE.secret)}">
        <div class="hint">The SHARED_SECRET value from the backend script</div>
      </div>
      <button onclick="connect()">Connect</button>
    </div>`;
}

function connect() {
  const u = document.getElementById("in_url").value.trim();
  const s = document.getElementById("in_secret").value.trim();
  if (!u || !s) { renderSetup("Both fields are required."); return; }
  STATE.backendUrl = u; STATE.secret = s;
  localStorage_set("sd_url", u);
  localStorage_set("sd_secret", s);
  loadSheet();
}

// ============================================================
//  DATA: fetch from Smartsheet
// ============================================================
async function loadSheet() {
  document.getElementById("app").innerHTML = `
    <div class="topbar">
      <div class="brandmark"><span class="dot">S</span> Summit Support</div>
    </div>
    <div class="loading"><div class="spinner"></div>Loading inquiries…</div>`;

  try {
    const url = STATE.backendUrl + "?action=rows&secret=" + encodeURIComponent(STATE.secret);
    const res = await fetch(url);
    if (!res.ok) throw new Error("Backend returned " + res.status + ". Check the URL.");
    const json = await res.json();
    if (!json.ok) throw new Error(json.error === "Unauthorized" ? "Access key rejected." : json.error);

    STATE.columns = json.data.columns;
    STATE.rows = json.data.rows;
    STATE.permalink = json.data.permalink || "";
    renderDashboard();
  } catch (e) {
    renderSetup(e.message + " — check the backend URL and access key.");
  }
}

// ============================================================
//  RENDER: dashboard
// ============================================================
function normStatus(s) {
  s = (s || "").toLowerCase();
  if (s.includes("progress")) return "Progress";
  if (s.includes("close")) return "Closed";
  return "Open";
}
function statusLabel(cls){ return cls === "Progress" ? "In Progress" : cls; }
function normReply(s) {
  // Anything that isn't explicitly "Replied" is treated as needing a reply
  return (s || "").toLowerCase().includes("repl") && !(s || "").toLowerCase().includes("need")
    ? "Replied" : "Needs";
}

function renderDashboard() {

  const open = rows.filter(r => normStatus(r[COLS.status]) === "Open").length;
  const prog = rows.filter(r => normStatus(r[COLS.status]) === "Progress").length;
  const closed = rows.filter(r => normStatus(r[COLS.status]) === "Closed").length;

  const natures = distinctValues(COLS.inquiryNature);
  const types = distinctValues(COLS.inquiryType);
  const subs = distinctValues(COLS.subCategory);

      <button class="refresh" onclick="loadSheet()">

        Refresh
      </button>
    </div>
    <div class="wrap">
      <aside class="sidebar">

          <div class="side-btns">
            ${["Open","Progress","Closed"].map(s =>
              `<button class="side-btn ${STATE.filters.status.includes(s)?'on':''}" onclick="toggleFilter('status','${s}')">${statusLabel(s)}</button>`
            ).join("")}
          </div>
        </div>
        <div class="side-sec">
          <div class="side-label">Correspondence</div>
          <div class="side-btns">
            ${["Email","In-Person"].map(c =>
              `<button class="side-btn ${STATE.filters.correspondence.includes(c)?'on':''}" onclick="toggleFilter('correspondence','${c}')">${c}</button>`

// Distinct non-empty values for a column, sorted
function distinctValues(colName) {
  const set = new Set();
  STATE.rows.forEach(r => { const v = r[colName]; if (v) set.add(v); });
  return Array.from(set).sort();
}
function anyFilterActive() {
  const f = STATE.filters;
  return f.status.length || f.correspondence.length || f.inquiryNature || f.inquiryType || f.subCategory;
}

// Apply all active filters + search to the row set
function applyFilters(rows) {
  const f = STATE.filters;
  if (f.status.length) rows = rows.filter(r => f.status.includes(normStatus(r[COLS.status])));
  if (f.correspondence.length) {
    rows = rows.filter(r => {
      const c = (r[COLS.correspondence] || "").toLowerCase();
      return f.correspondence.some(sel =>
        sel === "Email" ? c.includes("email") : (c.includes("person") || c.includes("in-person") || c.includes("in person"))
      );
    });
  }
  if (f.inquiryNature) rows = rows.filter(r => (r[COLS.inquiryNature]||"") === f.inquiryNature);
  if (f.inquiryType) rows = rows.filter(r => (r[COLS.inquiryType]||"") === f.inquiryType);
  if (f.subCategory) rows = rows.filter(r => (r[COLS.subCategory]||"") === f.subCategory);

  const q = STATE.search.trim().toLowerCase();
  if (q) {
    rows = rows.filter(r =>
      (r[COLS.name]||"").toLowerCase().includes(q) ||
      (r[COLS.addressStr]||"").toLowerCase().includes(q) ||
      (r[COLS.address]||"").toLowerCase().includes(q) ||
      (r[COLS.description]||"").toLowerCase().includes(q)
    );
  }
  return rows;
}

function renderGroups() {
  let rows = applyFilters(STATE.rows.slice());
  const el = document.getElementById("groups");

  if (!rows.length) {
    el.innerHTML = `<div class="empty">No inquiries match your filters.</div>`;
    return;
  }

  if (STATE.viewMode === "chronological") {
    // Flat list, newest first
    rows.sort((a, b) => new Date(b[COLS.dateReceived]||0) - new Date(a[COLS.dateReceived]||0));
    el.innerHTML = `<div class="flat-list">${rows.map(r => renderRow(r, true)).join("")}</div>`;
    return;
  }

  // Category view — grouped, each group sorted newest first
  const groups = {};
  rows.forEach(r => {
    const cat = r[COLS.inquiryType] || "Uncategorized";
    (groups[cat] = groups[cat] || []).push(r);
  });
  Object.keys(groups).forEach(cat => {
    groups[cat].sort((a, b) => new Date(b[COLS.dateReceived]||0) - new Date(a[COLS.dateReceived]||0));
  });

  const catOrder = Object.keys(CATEGORY_COLORS).filter(c => groups[c]);
  Object.keys(groups).forEach(c => { if (!catOrder.includes(c)) catOrder.push(c); });

  el.innerHTML = catOrder.map(cat => {
    const items = groups[cat];
    const color = CATEGORY_COLORS[cat] || "#6b7280";
    const openCount = items.filter(r => normStatus(r[COLS.status]) === "Open").length;
    const isOpen = STATE.openGroups[cat] !== false;
    return `
      <div class="group ${isOpen?'open':''}" data-cat="${escapeAttr(cat)}">
        <div class="group-head" onclick="toggleGroup('${escapeAttr(cat)}')">
          <span class="caret"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></span>
          <span class="cat-dot" style="background:${color}"></span>
          <span class="cat-name">${escapeHtml(cat)}</span>
          <span class="cat-count">${items.length}</span>
          <span class="cat-spacer"></span>
          ${openCount ? `<span class="mini-open">${openCount} open</span>` : ""}
        </div>
        <div class="group-body">
          ${items.map(r => renderRow(r, false)).join("")}
        </div>
      </div>`;
  }).join("");
}

    <div class="row ${reply === 'Needs' ? 'needs-reply' : ''}" data-rowid="${r._id}">
      <div class="pill-stack">

        </div>

        <div class="r-meta">
          ${date ? `<span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>${escapeHtml(fmtDate(date))}</span>` : ""}
          ${staff ? `<span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>${escapeHtml(staff)}</span>` : ""}
        </div>
      </div>
      <div class="actions">
        <button class="act primary" onclick='draftReply(${r._id})'>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/></svg>
          Reply
        </button>
        <button class="act" onclick='draftForward(${r._id})'>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 17 20 12 15 7"/><path d="M4 18v-2a4 4 0 0 1 4-4h12"/></svg>
          Forward
        </button>
        <button class="act" onclick='openThread(${r._id})'>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          Thread
        </button>
        <button class="act" onclick='openInSmartsheet(${r._id})'>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          Edit
        </button>

// ============================================================
//  INTERACTIONS
// ============================================================
function toggleGroup(cat) {
  const cur = STATE.openGroups[cat] !== false;
  STATE.openGroups[cat] = !cur;
  renderGroups();
}
function onSearch(v) { STATE.search = v; renderGroups(); }

// ---- View toggle ----
function setView(mode) { STATE.viewMode = mode; renderDashboard(); }

// ---- Sidebar filters ----
function toggleFilter(key, value) {
  const arr = STATE.filters[key];
  const i = arr.indexOf(value);
  if (i === -1) arr.push(value); else arr.splice(i, 1);
  renderDashboard();
}
function setDropdown(key, value) {
  STATE.filters[key] = value;
  renderDashboard();
}
function clearFilters() {
  STATE.filters = { status: [], correspondence: [], inquiryNature: "", inquiryType: "", subCategory: "" };
  renderDashboard();
}

// ---- Status change ----
let activeMenu = null;
function openStatusMenu(ev, rowId) {
  ev.stopPropagation();
  closeStatusMenu();
  const menu = document.createElement("div");
  menu.className = "status-menu";
  menu.innerHTML = STATUS_OPTIONS.map(s => `<button onclick="changeStatus(${rowId}, '${s}')">${s}</button>`).join("");
  document.body.appendChild(menu);
  const rect = ev.target.getBoundingClientRect();
  menu.style.top = (rect.bottom + window.scrollY + 4) + "px";
  menu.style.left = (rect.left + window.scrollX) + "px";
  activeMenu = menu;
  setTimeout(() => document.addEventListener("click", closeStatusMenu, { once: true }), 0);
}
function closeStatusMenu() { if (activeMenu) { activeMenu.remove(); activeMenu = null; } }

async function changeStatus(rowId, newStatus) {
  closeStatusMenu();
  const row = STATE.rows.find(r => r._id === rowId);
  if (!row) return;
  const prev = row[COLS.status];
  row[COLS.status] = newStatus;  // optimistic
  renderGroups();

  try {
    const res = await fetch(STATE.backendUrl, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        secret: STATE.secret,
        action: "updateStatus",
        rowId: rowId,
        status: newStatus
      })
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || "update failed");
    toast(`Marked ${newStatus}`);
    // Refresh the stat counts
    const open = STATE.rows.filter(r => normStatus(r[COLS.status]) === "Open").length;
    const prog = STATE.rows.filter(r => normStatus(r[COLS.status]) === "Progress").length;
    const closed = STATE.rows.filter(r => normStatus(r[COLS.status]) === "Closed").length;
    const nums = document.querySelectorAll(".stat .num");
    if (nums.length === 4) { nums[1].textContent = open; nums[2].textContent = prog; nums[3].textContent = closed; }
  } catch (e) {
    row[COLS.status] = prev; // revert
    renderGroups();
    toast("Couldn't update Smartsheet — try again");
  }
}

// ---- Toggle reply status (Needs Reply <-> Replied) ----
async function toggleReply(ev, rowId) {
  ev.stopPropagation();
  const row = STATE.rows.find(r => r._id === rowId);
  if (!row) return;
  const cur = normReply(row[COLS.replyStatus]);
  const next = cur === "Replied" ? "Needs Reply" : "Replied";
  const prev = row[COLS.replyStatus];
  row[COLS.replyStatus] = next;  // optimistic
  renderGroups();

  try {
    const res = await fetch(STATE.backendUrl, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        secret: STATE.secret,
        action: "updateCell",
        rowId: rowId,
        columnName: COLS.replyStatus,
        value: next
      })
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || "update failed");
    toast(`Marked ${next}`);
  } catch (e) {
    row[COLS.replyStatus] = prev; // revert
    renderGroups();
    toast("Couldn't update Smartsheet — try again");
  }
}

// ---- Draft reply / forward ----
let modalUrl = "";
async function draftReply(rowId) {
  const r = STATE.rows.find(x => x._id === rowId);
  if (!r) return;
  const name = r[COLS.name] || "there";
  const firstName = name.split(" ")[0];
  const email = r[COLS.email] || "";
  const issue = r[COLS.inquiryType] || "your inquiry";
  const subject = "Re: " + (r[COLS.subCategory] || issue);

  // Show a template immediately, then let AI refine it
  const template =
`Hi ${firstName},

Thank you for reaching out to the Summit support team. We've received your message regarding ${issue.toLowerCase()} and wanted to confirm it's been logged.

We're looking into this and will follow up with an update as soon as possible. If you have any additional details to share in the meantime, just reply to this email.

Best regards,
Summit Support Team`;

  showModal("Draft reply", email, subject, template, email);

  // Ask backend for an AI-generated version
  const ta = document.getElementById("modalText");
  const orig = ta.value;
  ta.value = "Generating draft…";
  ta.disabled = true;
  try {
    const res = await fetch(STATE.backendUrl, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        secret: STATE.secret,
        action: "draftReply",
        inquiry: {
          name: name,
          inquiryType: r[COLS.inquiryType] || "",
          subCategory: r[COLS.subCategory] || "",
          description: r[COLS.description] || ""
        }
      })
    });
    const json = await res.json();
    ta.value = (json.ok && json.draft) ? json.draft : orig;
  } catch (e) {
    ta.value = orig; // fall back to template
  }
  ta.disabled = false;
}

function draftForward(rowId) {
  const r = STATE.rows.find(x => x._id === rowId);
  if (!r) return;
  const name = r[COLS.name] || "Unknown";
  const addr = r[COLS.addressStr] || r[COLS.address] || "";
  const apt = r[COLS.apt] || "";
  const phone = r[COLS.phone] || "";
  const email = r[COLS.email] || "";
  const issue = r[COLS.inquiryType] || "";
  const sub = r[COLS.subCategory] || "";
  const desc = r[COLS.description] || "";
  const subject = `Tenant issue — ${addr}${apt ? " #"+apt : ""} — ${issue}`;

  const body =
`Please see the below tenant issue for your review and handling:

Tenant: ${name}
Address: ${addr}${apt ? " #"+apt : ""}
Phone: ${phone || "N/A"}
Email: ${email || "N/A"}
Category: ${issue}${sub ? " — " + sub : ""}

Description:
${desc}

Please advise on next steps or confirm once addressed. Thank you.

Summit Support Team`;

  showModal("Draft forward", "", subject, body);
}

function showModal(title, to, subject, body, threadEmail) {
  document.getElementById("modalTitle").textContent = title;
  document.getElementById("modalTo").textContent = to || "(enter recipient in Gmail)";
  document.getElementById("modalSubj").textContent = subject;
  document.getElementById("modalText").value = body;
  document.getElementById("overlay").classList.add("show");

  document.getElementById("modalOpenBtn").onclick = function() {
    const finalBody = document.getElementById("modalText").value;
    // Open the compose draft FIRST — it's the primary action and least likely to
    // be popup-blocked. Then open the thread a moment later. Subject starts with
    // "Re:" so Gmail groups the sent reply into the same conversation.
    const url = "https://mail.google.com/mail/?view=cm&fs=1"
      + (to ? "&to=" + encodeURIComponent(to) : "")
      + "&su=" + encodeURIComponent(subject)
      + "&body=" + encodeURIComponent(finalBody);
    window.open(url, "_blank");
    if (threadEmail) {
      setTimeout(function() { openGmailThread(threadEmail); }, 400);
    }
    closeModal();
    toast(threadEmail ? "Opened draft and thread in Gmail" : "Opened draft in Gmail");
  };
}
function closeModal() { document.getElementById("overlay").classList.remove("show"); }

// ---- Shared helper: open a tenant's Gmail thread in a side window ----
function openGmailThread(email) {
  const q = `from:(${email}) OR to:(${email})`;
  const url = "https://mail.google.com/mail/u/0/#search/" + encodeURIComponent(q);
  const w = Math.min(760, Math.floor(screen.width * 0.55));
  const feats = `width=${w},height=${Math.floor(screen.height*0.9)},left=${screen.width-w-20},top=40`;
  window.open(url, "gmailThread", feats);
}

// ---- Open Gmail thread for this tenant (Thread button) ----
function openThread(rowId) {
  const r = STATE.rows.find(x => x._id === rowId);
  if (!r) return;
  const email = r[COLS.email] || "";
  if (!email) { toast("No email address on this inquiry"); return; }
  openGmailThread(email);
}

// ---- Open this row in Smartsheet ----
function openInSmartsheet(rowId) {
  const r = STATE.rows.find(x => x._id === rowId);
  if (!STATE.permalink) { toast("Smartsheet link unavailable"); return; }
  // Permalink opens the sheet; append the row anchor so it scrolls to it
  const url = STATE.permalink + (r && r._rowNumber ? "?rowId=" + r._id : "");
  window.open(url, "_blank");
}

// ============================================================
//  UTILITIES
// ============================================================
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }
function fmtDate(d){
  // Smartsheet may return ISO or serial-ish; try to make it readable
  const dt = new Date(d);
  if (!isNaN(dt) && String(d).includes("-")) {
    return dt.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  }
  return d;
}
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2400);
}

// ============================================================
//  BOOT
